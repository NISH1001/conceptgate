[project]
name = "conceptgate"
version = "0.1.0"
description = "Concept Spectrogram Gate (CSG): a lightweight, few-shot internal guardrail adapter"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scikit-learn>=1.7.2",
    "loguru>=0.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["conceptgate"]

[dependency-groups]
dev = [
    "altair>=6.2.2",
    "marimo>=0.23.16",
    "pytest>=9.1.1",
]
